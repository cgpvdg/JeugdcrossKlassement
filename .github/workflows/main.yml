name: Deploy Vue apps to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install dependencies - Klassement
        run: npm install
        working-directory: JeugdcrossKlassement

      - name: Build Klassement
        run: npm run build
        working-directory: JeugdcrossKlassement

      - name: Install dependencies - Competitie
        run: npm install
        working-directory: JeugdcrossCompetitie

      - name: Build Competitie
        run: npm run build
        working-directory: JeugdcrossCompetitie

      - name: Prepare combined Pages output
        run: |
          mkdir -p public/Klassement
          mkdir -p public/Competitie
          cp -r JeugdcrossKlassement/dist/* public/Klassement/
          cp -r JeugdcrossCompetitie/dist/* public/Competitie/
          echo "crosscompetitie.nl" > public/CNAME
          cat > public/index.html << 'EOF'
          <!doctype html>
          <html>
            <head>
              <meta charset="utf-8" />
              <script>
                window.location.replace('/Competitie/')
              </script>
              <title>Redirect</title>
            </head>
            <body></body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
