name: Deploy Vue app to GitHub Pages

on:
  push:
    branches:
      - master  # of main, afhankelijk van jouw repo

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install
        working-directory: JeugdcrossKlassement

      - name: Build project
        run: npm run build
        working-directory: JeugdcrossKlassement

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: JeugdcrossKlassement/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
